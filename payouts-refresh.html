<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Link Expired — Whispers &amp; Warnings</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0A0714;
      color: #F3EEFF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #161026;
      border: 1px solid #3A2E5C;
      border-radius: 16px;
      padding: 40px 24px;
      max-width: 460px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 { color: #E5B85C; font-family: Georgia, serif; font-size: 24px; margin-top: 0; }
    p { color: #B4A9D0; font-size: 14px; line-height: 1.6; }
    .icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏳</div>
    <h1>Setup Link Expired</h1>
    <p>Your Stripe Express onboarding link has expired for your security.</p>
    <p>Please return to the <strong>Whispers &amp; Warnings</strong> app, go to the <strong>Payouts</strong> tab, and tap <strong>Set up payouts</strong> again to generate a new secure link.</p>
  </div>
</body>
</html>
